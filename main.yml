name: Run Hockey Parser

on:
  # Запуск по расписанию (например, каждый час). Можете настроить под себя.
  schedule:
    - cron: '0 * * * *'
  # Позволяет запускать парсер вручную кнопкой из вкладки Actions в GitHub
  workflow_dispatch:

jobs:
  parse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # Кэширование зависимостей ускоряет последующие запуски
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright

      - name: Install Playwright Chromium Browser
        run: playwright install chromium

      - name: Install Playwright Linux Dependencies
        run: playwright install-deps chromium

      - name: Run parser script
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python Sportac.py
