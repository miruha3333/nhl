name: Run Hockey Parser

on:
  schedule:
    # 1. Дневной режим (каждые 4 часа с 8:00 до 17:00 по МСК/Киеву -> с 5:00 до 14:00 UTC)
    # Запустится в 05:00, 09:00, 13:00 UTC (8:00, 12:00, 16:00 по местному)
    - cron: '0 5-14/4 * * *'

    # 2. Ночной режим (каждые 2 часа с 17:30 до 7:00 по МСК/Киеву -> с 14:30 до 4:00 UTC)
    # Запустится на 30-й минуте каждого второго часа в указанном промежутке
    - cron: '30 14-23/2 * * *'
    - cron: '30 0-4/2 * * *'

  # Оставляем кнопку для ручного запуска, если захочется проверить прямо сейчас
  workflow_dispatch:

jobs:
  parse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright

      - name: Install Playwright Chromium Browser
        run: playwright install chromium

      - name: Install Playwright Linux Dependencies
        run: playwright install-deps chromium

      - name: Run parser script
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python Sportac.py
