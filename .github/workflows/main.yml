name: Run Hockey Parser
on:
  schedule:
    # Каждые 2 часа с 10:00 до 15:00 по МСК (07:00-12:00 UTC)
    - cron: '0 7,9,11 * * *'
    # Каждые 1.5 часа в остальное время (UTC)
    - cron: '0 0,3,13,14,15,16,18,19,21,22 * * *'
    - cron: '30 1,4,16,19,22 * * *'
  workflow_dispatch:
jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests playwright-stealth
      - name: Install Playwright Browsers
        run: |
          python -m playwright install chromium --with-deps
      - name: Run parser script
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python Sportac.py
