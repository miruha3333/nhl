name: Run Hockey Parser

on:
  schedule:
    # Запуск в 05:13, 09:13, 13:13 по UTC
    - cron: '13 5,9,13 * * *'
    # Запуск в 14:41, 16:41, 18:41 и т.д. по UTC
    - cron: '41 14,16,18,20,22,23 * * *'
    # Запуск в 00:41, 02:41, 04:41 по UTC
    - cron: '41 0,2,4 * * *'

  workflow_dispatch:

jobs:
  parse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Добавляем playwright-stealth сюда
          pip install playwright requests playwright-stealth

      - name: Install Playwright Browsers
        run: |
          python -m playwright install chromium --with-deps

      - name: Run parser script
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python Sportac.py
