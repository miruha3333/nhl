name: Run Hockey Parser
on:
  schedule:
    # 9:00, 12:00, 16:00 по МСК (06:00, 09:00, 13:00 UTC)
    - cron: '0 6,9,13 * * *'
    # каждый час с 17:00 до 23:00 по МСК (14:00-20:00 UTC)
    - cron: '0 14,15,16,17,18,19,20 * * *'
    # каждый час с 00:00 до 08:00 по МСК (21:00-05:00 UTC)
    - cron: '0 21,22,23,0,1,2,3,4,5 * * *'
  workflow_dispatch:
jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests playwright-stealth
      - name: Install Playwright Browsers
        run: |
          python -m playwright install chromium --with-deps
      - name: Run parser script
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python Sportac.py
