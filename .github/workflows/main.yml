name: Run Hockey Parser

on:
  schedule:
    # 1. Дневной режим: каждые 4 часа с 8:00 до 17:00 по МСК/Киеву (с 5:00 до 14:00 UTC)
    # Запуски в 05:00, 09:00, 13:00 UTC
    - cron: '0 5,9,13 * * *'

    # 2. Ночной режим: каждые 2 часа с 17:30 до 7:00 по МСК/Киеву (с 14:30 до 4:00 UTC)
    # Запуски на 30-й минуте каждого нужного часа
    - cron: '30 14,16,18,20,22,23 * * *'
    - cron: '30 0,2,4 * * *'

  # Кнопка ручного запуска
  workflow_dispatch:

jobs:
  parse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # ИСПРАВЛЕНО: Убрали строчку cache: 'pip', которая вызывала ошибку

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright

      - name: Install Playwright Chromium Browser
        run: playwright install chromium

      - name: Install Playwright Linux Dependencies
        run: playwright install-deps chromium

      - name: Run parser script
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python Sportac.py
