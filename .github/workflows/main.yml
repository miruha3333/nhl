name: Run Hockey Parser

on:
  # Этот триггер ждет сигнал от внешнего сервиса (cron-job.org)
  repository_dispatch:
    types: [run_watcher]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.watcher.outputs.changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install watcher dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run watcher script
        id: watcher
        run: python watcher.py

  parse:
    needs: check
    if: needs.check.outputs.changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests deep-translator flask

      - name: Install Playwright Browsers
        run: |
          python -m playwright install chromium --with-deps

      - name: Run parser script
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python Sportac.py
