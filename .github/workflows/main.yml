name: Hockey News Parser

on:
  schedule:
    # Запуск каждые 15 минут (можно настроить под свои нужды)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Возможность запустить вручную через кнопку в GitHub

jobs:
  check:
    name: Check for Changes (Watcher)
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.watcher.outputs.changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies for watcher
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run watcher script
        id: watcher
        run: python watcher.py

  parse:
    name: Run Main Parser (Sportac)
    needs: check
    if: needs.check.outputs.changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies for parser
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests deep-translator beautifulsoup4

      - name: Install Playwright Browsers
        run: |
          python -m playwright install chromium --with-deps

      - name: Run parser script
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python Sportac.py
